packages: []

# Security: @huggingface/transformers pulls onnxruntime-node > adm-zip.
# CVE-2026-76845 has no patched adm-zip release; keep the exception narrow.
auditConfig:
  ignoreCves:
    - CVE-2026-76845

onlyBuiltDependencies:
  - esbuild
  - '@playwright/test'

overrides:
  # Keep the transitive dependency at the latest available release.
  adm-zip: '>=0.6.0'
  brace-expansion: 5.0.9
  flatted@<=3.4.1: '>=3.4.2'
  sharp: '>=0.35.0'

patchedDependencies:
  vite-ssg@28.3.0: patches/vite-ssg@28.3.0.patch

peerDependencyRules:
  allowedVersions:
    unhead: 2 || 3
