name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Published @vanduo-oss/vd3* pins install from npm. Labs siblings
# (@vanduo-oss/vdl-cbun, @vanduo-oss/vdl-hybrid-search) are link:-only — CI
# checks them out beside perspective/vd3-docs to match link:../../vdl-*.

# Least-privilege default token: this workflow only reads the repo (+ public siblings).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: perspective/vd3-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: perspective/vd3-docs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vanduo-oss/vdl-cbun
          path: vdl-cbun

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vanduo-oss/vdl-hybrid-search
          path: vdl-hybrid-search

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            perspective/vd3-docs/pnpm-lock.yaml
            vdl-cbun/pnpm-lock.yaml
            vdl-hybrid-search/pnpm-lock.yaml

      - name: Install and build Labs siblings
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in vdl-cbun vdl-hybrid-search; do
            echo "::group::Build $pkg"
            pnpm install --frozen-lockfile --dir "$pkg"
            pnpm run --dir "$pkg" build
            echo "::endgroup::"
          done

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run stylelint
      - run: pnpm run format:check

      - run: pnpm run build

      # Automated test suites (unit `pnpm test`, `pnpm run test:size`, and the
      # Playwright e2e suites) are intentionally NOT run in CI to conserve
      # GitHub Actions minutes — this is a docs site, and those suites (which
      # otherwise download a browser on every run) are run locally instead.
      # Run them with: pnpm test / pnpm run test:size / pnpm run test:e2e.
