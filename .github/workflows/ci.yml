name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uses the exact published package versions in pnpm-lock.yaml.

# Least-privilege default token: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run stylelint
      - run: pnpm run format:check

      - run: pnpm run build

      - run: pnpm test
      - run: pnpm run test:content
      - run: pnpm run test:size
      - name: Install Chromium for the focused browser smoke
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:smoke

      # The full visual and accessibility matrix remains a required local QA
      # step; this job runs focused search/navigation/responsive browser cases.
